# Quick checks on real Windows, on a push to windows-diag
name: windows-diag
on:
  push:
    branches: [windows-diag]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: build
        shell: msys2 {0}
        run: |
          "/c/Program Files/Git/cmd/git.exe" apply .github/diag/remove-tree.patch
          make
      - name: leftovers
        shell: pwsh
        run: |
          $env:PATH = "$PWD;$env:PATH"; $env:GIT_CONFIG_NOSYSTEM = "1"
          $t = Join-Path $env:TEMP ("pw" + (Get-Random)); New-Item -ItemType Directory $t | Out-Null
          $env:HOME = "$t/home"; New-Item -ItemType Directory $env:HOME | Out-Null
          $env:TMPDIR = "$t/tmp"; New-Item -ItemType Directory $env:TMPDIR | Out-Null
          git config --global user.name t; git config --global user.email t@t; git config --global init.defaultBranch master
          git init -q "$t/r"; Set-Location "$t/r"
          New-Item -ItemType Directory src | Out-Null
          Set-Content src/order.c ((1..50) | % { "o$_" }); Set-Content src/stock.c ((1..50) | % { "s$_" })
          git add -A; git commit -qm base
          & ait init; & ait session open --agent alice
          [IO.File]::WriteAllText("$t/r/cond.yaml", "body: |`n  stock never goes below zero`n")
          & ait future demand src/order.c:10-20 src/stock.c:5-9 cond.yaml -m "need stock"; "future exit 0x{0:X}" -f $LASTEXITCODE
          "--- left in TMPDIR:"
          Get-ChildItem -Recurse -Force $env:TMPDIR | % { "{0}  [{1}]  {2}" -f $_.FullName, $_.Attributes, $_.Length }
          "--- cmd dir /a /s:"
          cmd /c "dir /a /s `"$env:TMPDIR`""

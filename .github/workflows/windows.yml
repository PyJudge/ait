# Build ait natively for Windows as Git for Windows builds git (UCRT64, the
# runtime this repository's cross build uses; MINGW64's msvcrt lacks %zu),
# then run the suite in Git Bash against Git for Windows' own git
name: windows
on:
  push:
    branches: [windows]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: build
        shell: msys2 {0}
        run: make DEVELOPER=1
      - name: versions
        shell: bash
        run: |
          git --version
          command -v git sh
          ls -la ait.exe
      # each script on its own with a limit, so one that hangs on Windows is
      # reported instead of holding the suite; every output is kept
      - name: test
        shell: bash
        # as "make test" exports it, so the make a check runs (t50) keeps this build
        env:
          DEVELOPER: 1
        run: |
          mkdir -p out
          cd t
          ls t[0-9]*.sh | xargs -P 6 -I{} sh -c 'timeout 900 sh "$1" > "../out/$1.out" 2>&1; echo $? > "../out/$1.rc"' _ {}
          cd ..
          failed=0
          for f in out/*.rc; do
            t=$(basename "$f" .rc); rc=$(cat "$f")
            if [ "$rc" != 0 ]; then
              failed=$((failed + 1))
              [ "$rc" = 124 ] && echo "TIMEOUT $t" || echo "FAIL $t (rc $rc)"
              grep -A3 '^not ok' "out/$t.out" | head -12
            fi
          done
          echo "# $failed of $(ls out/*.rc | wc -l) scripts failed"
          [ "$failed" = 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: out/

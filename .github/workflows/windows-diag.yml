# Quick checks on real Windows, on a push to windows-diag: each failing
# script traced up to its first failing check
name: windows-diag
on:
  push:
    branches: [windows-diag]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: build
        shell: msys2 {0}
        run: make DEVELOPER=1
      - name: traces
        shell: bash
        run: |
          trace() { # SCRIPT CHECK: the trace up to 'not ok CHECK'
            echo "======== $1 (to not ok $2)"
            timeout 120 sh -x "t/$1.sh" > "trace.$1" 2>&1
            awk -v k="not ok $2 " 'index($0, k) == 1 { print; for (i = 0; i < 6 && (getline l) > 0; i++) print l; exit } { buf[NR % 70] = $0 } NR > 70 { } END { }' "trace.$1" > /dev/null
            n=$(grep -n "^not ok $2 " "trace.$1" | head -1 | cut -d: -f1)
            if [ -n "$n" ]; then sed -n "$((n > 60 ? n - 60 : 1)),$((n + 6))p" "trace.$1"; else tail -60 "trace.$1"; fi
          }
          trace t03-fulfill 9
          trace t09-rounds 6
          trace t18-check-request-paths 2
          trace t11-stage-child 3
          trace t16-request-paths 1
          trace t16-request-paths 10
          trace t17-new-file 6
          trace t25-subscription-path-context 7
          trace t41-message-boundary 52
          trace t19-draft-batch 999
          trace t44-notification-input 999
      - name: result-file
        if: always()
        shell: bash
        run: |
          . t/lib.sh; setup
          ait future demand src/order.c src/stock.c cond.yaml -m d >/dev/null
          ait fulfill $(newest D 2>/dev/null) -m f > "$T/out" 2>&1; cat "$T/out"
          res=$(git rev-parse --absolute-git-dir)/ait/check-result.yaml
          echo "res=$res"; od -c "$res" | head -20
          sed -i.bak 's/^  outcome:$/  outcome: pass/; s/^  basis: |$/  basis: |\n    checked/' "$res"; echo "sed rc=$?"
          od -c "$res" | head -20
